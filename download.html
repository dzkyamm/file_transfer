<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download - Local Drop</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="card" style="max-width: 600px; text-align: left;">
    <div class="page-head">
      <div>
        <h2 style="margin-bottom: 4px;">File Tersedia</h2>
        <div class="file-count" id="fileCount"></div>
      </div>
      <a href="index.html" class="nav-back">Beranda</a>
    </div>

    <div class="file-list" id="fileContainer">
      <div class="state-block">
        <svg class="state-icon spin" width="24" height="24" stroke="currentColor" viewBox="0 0 24 24" fill="none">
          <path stroke-linecap="round" stroke-width="2" d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"></path>
        </svg>
        <p>Mencari file...</p>
      </div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="download.js"></script>
</body>
</html>
