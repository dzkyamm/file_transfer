<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07110f">
  <title>Files — Local Drop</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <main class="app-shell page-shell">
    <nav class="topbar">
      <a class="brand" href="index.html"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M7 8.5A5 5 0 0 1 17 8.5M4 5.5a9 9 0 0 1 16 0M9.5 12a2.5 2.5 0 0 1 5 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="16.8" r="1.4" fill="currentColor"/></svg></span><span>Local Drop</span></a>
      <a href="upload.html" class="btn btn-primary btn-compact"><span>+</span> Upload file</a>
    </nav>
    <section class="files-header">
      <div>
        <a href="index.html" class="nav-back">← Beranda</a>
        <div class="eyebrow"><span>SHARED FILES</span><span class="eyebrow-line"></span></div>
        <h1>File tersedia</h1>
        <p>Masukkan alamat IP storage untuk mengakses dan mengunduh file.</p>
      </div>
      <div class="storage-stat"><span class="stat-label">RETENTION</span><strong><span class="status-dot"></span> 24 jam</strong><small id="fileCount">Masukkan IP...</small></div>
    </section>

    <!-- Gerbang Input IP -->
    <section class="panel ip-gate-panel" id="ipGateSection">
      <div class="panel-head">
        <div><span class="panel-kicker">STORAGE ACCESS</span><h2>Masukkan Alamat IP</h2></div>
        <div class="secure-badge"><span></span> Secure IP</div>
      </div>
      <form id="ipForm" class="ip-form">
        <div class="ip-input-wrap">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z" stroke="currentColor" stroke-width="1.7"/><path d="M12 6v6l4 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <!-- Pattern diperbarui agar bisa menerima tanda titik (.) -->
          <input type="text" id="ipInput" placeholder="Contoh: 192.168.12.80" pattern="[0-9.]+" title="Masukkan alamat IP (kombinasi angka dan titik)" autocomplete="off" required>
        </div>
        <button type="submit" class="btn btn-primary" id="ipSubmitBtn">
          <span>Akses Storage IP</span>
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14m0 0-4-4m4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
    </section>

    <!-- Workspace File (Muncul setelah IP dimasukkan) -->
    <section class="panel files-panel" id="fileWorkspaceSection" style="display: none;">
      <div class="file-toolbar">
        <div class="active-ip-badge" id="activeIpDisplay">IP: <span id="currentIpText"></span> <button type="button" id="changeIpBtn" class="btn-link">Ganti IP</button></div>
        <label class="search-box" for="searchInput">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <input id="searchInput" type="search" placeholder="Cari nama file..." autocomplete="off">
          <kbd>⌘ K</kbd>
        </label>
        <div class="toolbar-actions">
          <select id="sortSelect" class="select-control" aria-label="Urutkan file"><option value="newest">Terbaru</option><option value="oldest">Terlama</option></select>
          <button class="icon-button" id="refreshBtn" type="button" aria-label="Muat ulang file" title="Muat ulang"><svg viewBox="0 0 24 24" fill="none"><path d="M19 8a7 7 0 1 0 .5 7M19 8V4m0 4h-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </div>
      <div class="list-heading"><span>FILE</span><span>AKSI</span></div>
      <div class="file-list" id="fileContainer"><div class="state-block"><div class="loader"></div><p>Mencari file...</p></div></div>
    </section>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="download.js"></script>
</body>
</html>
