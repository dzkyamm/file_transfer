<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Drop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="signal" aria-hidden="true">
      <svg width="80" height="40" viewBox="0 0 80 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="9" width="14" height="22" rx="4" stroke="var(--ink-faint)" stroke-width="1.6"/>
        <rect x="65" y="4" width="14" height="32" rx="4" stroke="var(--ink-faint)" stroke-width="1.6"/>
        <path class="signal-line" d="M17 20 H63" stroke="var(--line)" stroke-width="1.6"/>
        <circle class="signal-dot" r="3.5" fill="var(--pulse)"/>
      </svg>
    </div>

    <h1>Local Drop</h1>
    <p class="subtitle">Kirim file antar HP dan laptop dalam satu jaringan, tanpa kabel dan tanpa ribet.</p>

    <div class="btn-row">
      <a href="upload.html" class="btn btn-dark">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
        Upload File Baru
      </a>
      <a href="download.html" class="btn btn-outline">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        Lihat File Tersedia
      </a>
    </div>
  </div>
</body>
</html>
